<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Vendora.ai — Améliore ta photo</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4f5f7;--surface:#fff;--panel:#fafafa;--border:#eaeaec;--border-2:#e0e3ef;--hair:#f0f0f2;
    --text:#0e0f13;--muted:#6b6d78;--faint:#9a9ca6;--brand:#2f6bff;
    --font:"Plus Jakarta Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);font-weight:400;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{width:min(1000px,90%);margin-inline:auto}

  /* barre attachée en haut (page connectée) + hamburger */
  .nav-scrim{position:fixed;inset:0;z-index:40;opacity:0;visibility:hidden;pointer-events:none;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(18,19,24,.06);transition:opacity .25s ease,visibility .25s}
  .nav-scrim.show{opacity:1;visibility:visible;pointer-events:auto}
  header{position:sticky;top:0;z-index:50;margin-top:0}
  .nav{position:relative;display:flex;flex-direction:column;width:100%;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--border)}
  .nav-top{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:1120px;width:100%;margin:0 auto;padding:0 24px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
  .logo .mark{width:24px;height:24px;border-radius:7px;background:var(--text);display:grid;place-items:center}
  .logo .mark svg{width:14px;height:14px}
  .logo .ai{color:var(--faint);font-weight:600}
  .nav-links{display:flex;align-items:center;gap:24px}
  .nav-links a{color:var(--muted);font-weight:500;font-size:14.5px;transition:color .15s}
  .nav-links a:hover{color:var(--text)}
  .nav-end{display:flex;align-items:center;gap:16px}
  .nav-logout{color:var(--muted);font-weight:500;font-size:14px}
  .nav-logout:hover{color:var(--text)}
  .burger{position:relative;display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:34px;height:34px;border:none;background:none;cursor:pointer;border-radius:9px;transition:background .15s}
  .burger:hover{background:var(--panel)}
  .burger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:transform .25s ease,opacity .18s ease}
  .nav.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav.open .burger span:nth-child(2){opacity:0}
  .nav.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .mob-menu{display:flex;flex-direction:column;align-items:center;gap:2px;position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 20px 44px -18px rgba(14,15,19,.4);padding:12px 14px 16px;opacity:0;visibility:hidden;transform:translateY(-8px);pointer-events:none;transition:opacity .2s ease,transform .22s ease,visibility .2s}
  .nav.open .mob-menu{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
  .mob-menu a{display:block;width:100%;text-align:center;padding:13px 12px;border-radius:10px;font-size:15px;color:var(--text);font-weight:500}
  .mob-menu a:hover{background:var(--panel)}
  .mob-user{width:100%;border:1px solid var(--text);border-radius:10px;padding:12px;text-align:center;font-weight:600;font-size:14.5px;color:var(--text);word-break:break-word;margin-bottom:2px}
  .mob-cr-line{font-size:14px;font-weight:600;color:var(--text);padding:8px 8px 4px}
  .mob-cr-line b{color:var(--brand)}
  /* mobile : onglets cachés, hamburger visible */
  @media(max-width:760px){ .nav-links,.nav-logout{display:none!important} .burger{display:flex} }
  .back{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:500;font-size:14px}
  .back:hover{color:var(--text)}
  .back svg{width:16px;height:16px}
  .credits{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 13px}
  .credits svg{width:15px;height:15px;color:var(--brand)}
  .credits b{color:var(--text);font-weight:700}

  .account{position:relative}
  .acct-btn{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 11px 5px 6px;cursor:pointer;font-family:var(--font);transition:border-color .15s}
  .acct-btn:hover{border-color:var(--faint)}
  .avatar{width:30px;height:30px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
  .avatar.sm{width:34px;height:34px;font-size:14px;border-radius:9px}
  .acct-info{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
  .acct-name{font-weight:600;font-size:13.5px;color:var(--text)}
  .acct-cr{font-size:11.5px;color:var(--muted)}
  .acct-cr{font-size:13.5px;font-weight:600;color:var(--text)}
  .acct-cr b{color:var(--text);font-weight:700}
  .acct-chev{width:15px;height:15px;color:var(--faint);transition:transform .15s}
  .account.open .acct-chev{transform:rotate(180deg)}
  .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px -16px rgba(14,15,19,.3);padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.16s}
  .account.open .acct-menu{opacity:1;visibility:visible;transform:translateY(0)}
  .acct-head{display:flex;align-items:center;gap:10px;padding:10px 12px 12px;border-bottom:1px solid var(--hair);margin-bottom:6px}
  .acct-head b{display:block;font-size:14px;font-weight:600}
  .acct-head span{color:var(--muted);font-size:12.5px}
  .acct-menu a{display:block;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--text);font-weight:500}
  .acct-menu a:hover{background:var(--panel)}
  @media(max-width:600px){.acct-name{display:none}}

  .btn{font-family:var(--font);font-weight:600;font-size:14.5px;cursor:pointer;border:none;border-radius:8px;padding:11px 18px;transition:background .15s,border-color .15s}
  .btn-primary{background:var(--text);color:#fff}
  .btn-primary:hover{background:#25262c}
  .btn-line{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn-line:hover{border-color:var(--faint)}

  main{min-height:calc(100vh - 51px);display:flex;flex-direction:column;justify-content:center;padding:40px 0}
  .head{text-align:center;max-width:560px;margin:0 auto 30px}
  .head h1{font-weight:700;font-size:clamp(26px,3.6vw,36px);letter-spacing:-.03em;margin-bottom:8px}
  .head h1 .k{color:var(--brand)}
  .head p{color:var(--muted);font-size:15.5px}

  /* en-tête façon landing */
  .app-head{text-align:center;max-width:560px;margin:0 auto 40px}
  .app-head .eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:14px}
  .app-head h1{font-weight:700;letter-spacing:-.03em;line-height:1.08;font-size:clamp(28px,4.6vw,42px);margin-bottom:10px}
  .app-head .sub{color:var(--muted);font-weight:400;font-size:15.5px}
  /* éditeur */
  .tool{max-width:540px;margin:0 auto}
  /* zone d'import (carte nette) */
  .drop{position:relative;display:block;width:100%;aspect-ratio:1;border:1px solid var(--border);border-radius:20px;background:#fff;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px rgba(14,15,19,.04),0 18px 44px -30px rgba(14,15,19,.35);transition:border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
  .drop:hover,.drop.drag{border-color:var(--text);box-shadow:0 1px 2px rgba(14,15,19,.04),0 22px 50px -30px rgba(14,15,19,.35)}
  .drop-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px;pointer-events:none}
  .drop-ic{width:62px;height:62px;border-radius:50%;background:rgba(47,107,255,.1);color:var(--brand);display:grid;place-items:center;margin-bottom:10px;transition:background .15s,color .15s}
  .drop:hover .drop-ic,.drop.drag .drop-ic{background:rgba(14,15,19,.08);color:var(--text)}
  .drop-ic svg{width:26px;height:26px}
  .drop-hint b{font-size:17px;font-weight:600}
  .drop-sub{color:var(--muted);font-size:13.5px}
  /* overlay pendant la génération */
  .gen-overlay{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .drop.gen{pointer-events:none}
  .drop.gen .gen-overlay{display:flex}
  .gen-overlay b{font-size:15.5px;font-weight:600}
  .gen-overlay span{font-size:12.5px;color:var(--muted);max-width:260px}
  .spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--text);animation:vspin .8s linear infinite}
  @keyframes vspin{to{transform:rotate(360deg)}}
  /* overlay plein écran pendant la génération */
  .page-gen{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(244,245,247,.86);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:pgfade .2s ease}
  .page-gen.show{display:flex}
  .page-gen .spinner{width:56px;height:56px;border-width:4px}
  .page-gen b{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .page-gen span{font-size:13.5px;color:var(--muted);max-width:320px}
  @keyframes pgfade{from{opacity:0}to{opacity:1}}
  /* résultat : affiché dans son format de sortie (pas de carré) */
  .result{display:none;max-width:560px;margin:0 auto;flex-direction:column;align-items:center;gap:18px}
  .result.show{display:flex}
  .result img{max-width:100%;max-height:74vh;width:auto;height:auto;border-radius:18px;box-shadow:0 1px 2px rgba(14,15,19,.04),0 26px 60px -30px rgba(14,15,19,.45);display:block}
  .result-actions{display:flex;gap:12px;width:100%;max-width:420px}
  .result-actions .go{margin-top:0;flex:1}
  .go-line{background:#fff;color:var(--text);border:1px solid var(--border);box-shadow:none}
  .go-line:hover{background:var(--panel);border-color:var(--faint)}
  .preview{display:none}
  .preview.show{display:block;position:absolute;inset:0}
  .preview img{width:100%;height:100%;display:block;object-fit:cover}
  .drop:has(.preview.show) .drop-hint{display:none}
  .drop:has(.preview.show)::after{content:"Changer de photo";position:absolute;left:0;right:0;bottom:0;padding:26px 10px 12px;background:linear-gradient(transparent,rgba(14,15,19,.55));color:#fff;font-size:13px;font-weight:600;text-align:center;opacity:0;transition:opacity .15s;pointer-events:none}
  .drop:has(.preview.show):hover::after{opacity:1}

  /* choix des fonds : vignettes image */
  .bgpick{margin-top:36px}
  .bgpick-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:16px}
  .bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .bg{padding:0;border:none;background:none;cursor:pointer;font-family:var(--font)}
  .bg-thumb{position:relative;display:block;width:100%;height:98px;border-radius:14px;background-size:cover;background-position:center;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--border);transition:box-shadow .15s,transform .12s}
  .bg:hover .bg-thumb{transform:translateY(-2px)}
  .bg.active .bg-thumb{box-shadow:inset 0 0 0 2.5px var(--text)}
  .bg-name{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 8px;background:linear-gradient(transparent,rgba(14,15,19,.62));color:#fff;font-size:12.5px;font-weight:600;text-align:center}
  .bg-check{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s}
  .bg-check svg{width:13px;height:13px}
  .bg.active .bg-check{opacity:1;transform:scale(1)}
  @media(max-width:520px){ .bgs{grid-template-columns:repeat(4,1fr);gap:8px} .bg-thumb{height:64px} .bg-name{font-size:10.5px;padding:14px 3px 6px} }

  .go{width:100%;margin-top:34px;padding:16px;font-size:15.5px;font-weight:600;font-family:var(--font);cursor:pointer;border:none;border-radius:14px;background:var(--text);color:#fff;transition:background .15s,transform .1s;box-shadow:0 12px 26px -12px rgba(14,15,19,.55)}
  .go:hover{background:#25262c}
  .go:active{transform:translateY(1px)}
  .go:disabled{background:var(--panel);color:var(--faint);border:1px solid var(--border);box-shadow:none;cursor:not-allowed}
  .go:disabled:hover{background:var(--panel)}
  .hint{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--faint);font-size:12.5px;margin-top:12px}
  .hint svg{width:14px;height:14px;color:var(--brand)}

  /* modale Paramètres */
  .modal-overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(18,19,24,.28);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .modal-overlay.show{display:flex}
  .modal{width:100%;max-width:380px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 24px 60px -20px rgba(14,15,19,.45);overflow:hidden}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--hair)}
  .modal-head h3{font-size:16px;font-weight:700}
  .modal-close{width:32px;height:32px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;border-radius:8px;line-height:1}
  .modal-close:hover{background:var(--panel);color:var(--text)}
  .modal-body{padding:18px}
  .set-mail{font-size:13.5px;color:var(--muted);text-align:center;margin-bottom:14px;word-break:break-word}
  .btn-logout{width:100%;padding:13px;border:1px solid var(--border);background:#fff;color:#e5484d;font-family:var(--font);font-weight:600;font-size:14.5px;border-radius:10px;cursor:pointer;transition:.15s}
  .btn-logout:hover{background:#fff5f5;border-color:#f3c2c4}
  .set-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border:1px solid var(--border);background:#fff;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--text);margin-bottom:10px;transition:.15s}
  .set-row:hover{background:var(--panel);border-color:var(--faint)}
  .set-row-l{display:flex;align-items:center;gap:10px}
  .set-row-l svg{width:18px;height:18px;color:var(--muted)}
  .set-row-chev{width:16px;height:16px;color:var(--faint)}
  .soon-emoji{font-size:40px;margin:6px 0 10px}
  .soon-text{font-size:15px;font-weight:600;color:var(--text)}
</style>
</head>
<body>

<div class="nav-scrim" id="navScrim"></div>
<header>
  <div class="wrap nav" id="nav">
    <div class="nav-top">
      <a class="logo" href="index.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M6 7l6 10.5L18 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Vendora<span class="ai">.ai</span></span>
      </a>
      <nav class="nav-links">
        <a href="app.html">Retouche IA</a>
        <a href="historique.html">Historique</a>
        <a href="parametres.html">Paramètres</a>
        <a href="tarifs.html">Tarifs</a>
        <a href="shop.html">Shop</a>
      </nav>
      <div class="nav-end">
        <button class="burger" id="burgerBtn" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mob-menu" id="mobMenu">
      <a href="app.html" data-nav="generation">Retouche IA</a>
      <a href="historique.html">Historique</a>
      <a href="parametres.html">Paramètres</a>
      <a href="tarifs.html">Tarifs</a>
      <a href="shop.html">Shop</a>
    </div>
  </div>
</header>


<main>
  <div class="wrap">
    <div class="tool" id="editor">
      <label class="drop" id="importBtn">
        <input type="file" id="file" accept="image/*" hidden />
        <div class="preview" id="preview"></div>
        <div class="drop-hint">
          <div class="drop-ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0 4 4m-4-4-4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></div>
          <b id="importLabel">Importe ta photo</b>
          <span class="drop-sub">Glisse-la ici ou clique pour choisir</span>
        </div>
        <div class="gen-overlay">
          <div class="spinner"></div>
          <b>Amélioration en cours…</b>
        </div>
      </label>

      <div class="bgpick">
        <span class="bgpick-label">Choisis un fond</span>
        <div class="bgs">
          <button class="bg" data-bg="parquet"><span class="bg-thumb" style="background-image:url('backgrounds/parquet.jpg')"><span class="bg-check"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="bg-name">Parquet</span></span></button>
          <button class="bg" data-bg="moquette"><span class="bg-thumb" style="background-image:url('backgrounds/moquette.jpg')"><span class="bg-check"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="bg-name">Végétal</span></span></button>
          <button class="bg" data-bg="solbrut"><span class="bg-thumb" style="background-image:url('backgrounds/solbrut.jpg')"><span class="bg-check"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="bg-name">Sol brut</span></span></button>
          <button class="bg" data-bg="tapis"><span class="bg-thumb" style="background-image:url('backgrounds/tapis.png')"><span class="bg-check"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="bg-name">Tapis</span></span></button>
        </div>
      </div>

      <button class="go" id="go" disabled>Améliorer ma photo</button>
    </div>

    <div class="result" id="result">
      <img id="resultImg" alt="résultat retouché">
      <div class="result-actions">
        <a class="go" id="dlBtn" download="vendora.png">Télécharger</a>
        <button class="go go-line" id="againBtn" type="button">Nouvelle photo</button>
      </div>
    </div>
  </div>
</main>

<div class="page-gen" id="pageGen">
  <div class="spinner"></div>
  <b>Amélioration en cours…</b>
</div>

<script>
  /* ---------- Supabase : session obligatoire ---------- */
  const SUPABASE_URL = "https://zipzllczqfcfvyydvmpy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ujJAZvyLdjDzFSWbwBguWw_f0yIMJvs";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const COST = 100; // crédits par génération
  const BACKEND = ""; // même origine : /api est servi par ce projet // backend Next (Vercel) — CORS + auth + crédits serveur
  let USER = null, TOKEN = null, credits = null, plan = null;

  function creditsLabel(){ if(plan==="ultimate") return "∞"; if(credits===null) return "…"; try{return credits.toLocaleString("fr-FR");}catch(e){return String(credits);} }
  function paintCredits(){ const el=document.getElementById("creditCount"); if(el) el.textContent = creditsLabel(); }

  function fillUser(u){
    USER = u;
    const name = (u.user_metadata && (u.user_metadata.name || u.user_metadata.full_name)) || (u.email ? u.email.split("@")[0] : "Mon compte");
    const setT=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
    setT("setMail", u.email||name);
    localStorage.setItem("vendora_user", JSON.stringify({id:u.id,name:name,email:u.email||""}));
    loadCredits();
  }
  async function loadCredits(){
    if(!USER) return;
    const { data } = await sb.from("profiles").select("credits, plan").eq("id", USER.id).maybeSingle();
    if(data){ credits = data.credits; plan = data.plan; }
    paintCredits();
  }
  sb.auth.getSession().then(({data})=>{
    if(!data.session){ window.location.href="auth.html"; return; }
    TOKEN = data.session.access_token;
    fillUser(data.session.user);
  });

  // menu hamburger (barre attachée)
  (function(){
    const nav=document.getElementById("nav"), btn=document.getElementById("burgerBtn"), menu=document.getElementById("mobMenu"), scrim=document.getElementById("navScrim");
    if(!nav||!btn||!menu) return;
    const close=()=>{nav.classList.remove("open");btn.setAttribute("aria-expanded","false");if(scrim)scrim.classList.remove("show");};
    btn.addEventListener("click",e=>{e.stopPropagation();const open=nav.classList.toggle("open");btn.setAttribute("aria-expanded",open?"true":"false");if(scrim)scrim.classList.toggle("show",open);});
    menu.querySelectorAll("a").forEach(a=>a.addEventListener("click",close));
    document.addEventListener("click",e=>{ if(!nav.contains(e.target)) close(); });
  })();
  document.querySelectorAll(".js-logout").forEach(el=>el.addEventListener("click",async e=>{e.preventDefault();await sb.auth.signOut();localStorage.removeItem("vendora_user");window.location.href="index.html";}));

  // onglet Paramètres -> modale (avec déconnexion)
  (function(){
    const modal=document.getElementById("settingsModal");
    if(!modal) return;
    const close=()=>modal.classList.remove("show");
    document.querySelectorAll('[data-nav="parametres"]').forEach(a=>a.addEventListener("click",e=>{e.preventDefault();modal.classList.add("show");}));
    document.getElementById("settingsClose").addEventListener("click",close);
    modal.addEventListener("click",e=>{ if(e.target===modal) close(); });
  })();


  const file=document.getElementById("file");
  const preview=document.getElementById("preview"),importLabel=document.getElementById("importLabel"),go=document.getElementById("go");
  let bg=null;
  function updateGo(){ go.disabled = !(file.files && file.files[0] && bg); }
  document.querySelectorAll(".bg").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".bg").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");bg=b.dataset.bg;updateGo();
  }));
  function render(){
    const f=file.files&&file.files[0];
    if(!f) return;
    const url=URL.createObjectURL(f);
    preview.innerHTML='<img src="'+url+'" alt="aperçu">';
    preview.classList.add("show");
    importLabel.textContent="Changer de photo";
    updateGo();
  }
  file.addEventListener("change",render);
  // glisser-déposer sur la zone d'import
  (function(){
    const drop=document.getElementById("importBtn");
    if(!drop) return;
    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag");}));
    ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag");}));
    drop.addEventListener("drop",e=>{
      e.preventDefault();drop.classList.remove("drag");
      if(e.dataTransfer.files && e.dataTransfer.files[0]){ file.files=e.dataTransfer.files; render(); }
    });
  })();
  document.getElementById("resetBtn")?.addEventListener("click",()=>{ location.reload(); });
  function showResult(url){
    // on masque tout l'éditeur (import + fonds + bouton) et on affiche le
    // résultat dans son format de sortie naturel (pas de recadrage carré).
    document.getElementById("editor").style.display="none";
    document.getElementById("resultImg").src=url;
    document.getElementById("dlBtn").href=url;
    document.getElementById("result").classList.add("show");
  }
  document.getElementById("againBtn").addEventListener("click",()=>location.reload());

  go.addEventListener("click",async ()=>{
    if(!file.files||!file.files[0]||!bg){ return; }
    if(!TOKEN){ alert("Session expirée, reconnecte-toi."); location.href="auth.html"; return; }
    if(plan!=="ultimate" && credits!==null && credits < COST){
      alert("Crédits insuffisants — il faut "+COST+" crédits par génération (solde : "+credits+").");
      location.href="index.html#pricing"; return;
    }
    go.disabled=true; const prev=go.textContent; go.textContent="Amélioration…";
    const editorEl=document.getElementById("editor");
    const pageGen=document.getElementById("pageGen");
    let ok=false;
    editorEl.style.display="none";   // on enlève tout (import + fonds + bouton)
    pageGen.classList.add("show");   // chargement plein écran sur le fond
    try{
      // génération via le backend Vercel — il vérifie le token, décompte les crédits
      // côté serveur et renvoie l'image (ou 402 si crédits épuisés).
      const fd=new FormData();
      fd.append("image1", file.files[0], file.files[0].name||"photo.png");
      fd.append("background", bg);
      const r=await fetch(BACKEND+"/api/generate",{
        method:"POST",
        headers:{ "Authorization":"Bearer "+TOKEN },
        body:fd
      });
      if(r.status===402){ // crédits épuisés → paywall
        alert("Crédits insuffisants — recharge ton forfait pour continuer.");
        location.href="index.html#pricing"; return;
      }
      const ct=r.headers.get("content-type")||"";
      if(!(r.ok && ct.indexOf("image/")===0)){
        let msg="Échec de la génération ("+r.status+").";
        try{ const j=await r.json(); if(j&&j.error) msg=j.error; }catch(e){}
        alert(msg); return;
      }
      const blob=await r.blob();
      // affiche le résultat puis rafraîchit le solde (mis à jour côté serveur)
      showResult(URL.createObjectURL(blob));
      ok=true;
      loadCredits();
    }catch(err){
      alert("Impossible de contacter le serveur (il démarrait peut-être — réessaie dans quelques secondes).");
    }finally{
      pageGen.classList.remove("show");
      if(!ok) editorEl.style.display="";   // échec → on remet l'éditeur
      go.disabled=false; go.textContent=prev;
    }
  });
</script>
