<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Paramètres — Vendora.ai</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4f5f7;--surface:#fff;--panel:#fafafa;--border:#eaeaec;--border-2:#e0e3ef;--hair:#f0f0f2;
    --text:#0e0f13;--muted:#6b6d78;--faint:#9a9ca6;--brand:#2f6bff;
    --font:"Plus Jakarta Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);font-weight:400;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{width:min(1000px,90%);margin-inline:auto}

  /* barre attachée en haut (page connectée) + hamburger */
  .nav-scrim{position:fixed;inset:0;z-index:40;opacity:0;visibility:hidden;pointer-events:none;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(18,19,24,.06);transition:opacity .25s ease,visibility .25s}
  .nav-scrim.show{opacity:1;visibility:visible;pointer-events:auto}
  header{position:sticky;top:0;z-index:50;margin-top:0}
  .nav{position:relative;display:flex;flex-direction:column;width:100%;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--border)}
  .nav-top{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:1120px;width:100%;margin:0 auto;padding:0 24px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
  .logo .mark{width:24px;height:24px;border-radius:7px;background:var(--text);display:grid;place-items:center}
  .logo .mark svg{width:14px;height:14px}
  .logo .ai{color:var(--faint);font-weight:600}
  .nav-links{display:flex;align-items:center;gap:24px}
  .nav-links a{color:var(--muted);font-weight:500;font-size:14.5px;transition:color .15s}
  .nav-links a:hover,.nav-links a.active{color:var(--text)}
  .nav-end{display:flex;align-items:center;gap:14px}
  .burger{position:relative;display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:34px;height:34px;border:none;background:none;cursor:pointer;border-radius:9px;transition:background .15s}
  .burger:hover{background:var(--panel)}
  .burger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:transform .25s ease,opacity .18s ease}
  .nav.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav.open .burger span:nth-child(2){opacity:0}
  .nav.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .mob-menu{display:flex;flex-direction:column;align-items:center;gap:2px;position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 20px 44px -18px rgba(14,15,19,.4);padding:12px 14px 16px;opacity:0;visibility:hidden;transform:translateY(-8px);pointer-events:none;transition:opacity .2s ease,transform .22s ease,visibility .2s}
  .nav.open .mob-menu{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
  .mob-menu a{display:block;width:100%;text-align:center;padding:13px 12px;border-radius:10px;font-size:15px;color:var(--text);font-weight:500}
  .mob-menu a:hover{background:var(--panel)}
  @media(max-width:760px){ .nav-links{display:none!important} .burger{display:flex} .nav-end .credits{display:none} }
  .credits{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 13px}
  .credits svg{width:15px;height:15px;color:var(--brand)}
  .credits b{color:var(--text);font-weight:700}

  /* --- page Paramètres --- */
  main{min-height:calc(100vh - 57px);padding:48px 0 84px}
  .set-wrap{max-width:560px;margin:0 auto}
  .set-title{font-weight:700;font-size:clamp(24px,3vw,30px);letter-spacing:-.03em;margin-bottom:26px}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:6px;margin-bottom:16px;box-shadow:0 1px 2px rgba(14,15,19,.04)}
  .card-h{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 14px 8px}
  .acct-row{display:flex;align-items:center;gap:14px;padding:8px 14px 16px}
  .acct-av{width:46px;height:46px;border-radius:12px;background:var(--text);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex-shrink:0}
  .acct-meta b{display:block;font-size:15px;font-weight:600}
  .acct-meta span{color:var(--muted);font-size:13.5px;word-break:break-word}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--text);transition:background .15s;cursor:pointer}
  .row:hover{background:var(--panel)}
  .row-l{display:flex;align-items:center;gap:12px}
  .row-l .ic{width:20px;height:20px;color:var(--muted);flex-shrink:0}
  .row .chev{width:16px;height:16px;color:var(--faint)}
  .row .val{margin-left:auto;color:var(--muted);font-weight:600;font-size:14px}
  .row .val b{color:var(--text)}
  .row.disabled{opacity:.42;pointer-events:none;cursor:default}
  .row.disabled .val{font-size:12px;font-weight:600}
  .row-sep{height:1px;background:var(--hair);margin:0 14px}
  .btn-logout{width:100%;padding:14px;border:none;background:none;color:#e5484d;font-family:var(--font);font-weight:600;font-size:14.5px;border-radius:12px;cursor:pointer;transition:.15s;text-align:center}
  .btn-logout:hover{background:#fff5f5}
</style>
</head>
<body>

<div class="nav-scrim" id="navScrim"></div>
<header>
  <div class="wrap nav" id="nav">
    <div class="nav-top">
      <a class="logo" href="index.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M6 7l6 10.5L18 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Vendora<span class="ai">.ai</span></span>
      </a>
      <nav class="nav-links">
        <a href="app.html">Retouche IA</a>
        <a href="historique.html">Historique</a>
        <a href="parametres.html" class="active">Paramètres</a>
        <a href="tarifs.html">Tarifs</a>
        <a href="shop.html">Shop</a>
      </nav>
      <div class="nav-end">
        <div class="credits"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v9M9.6 10.2h3.1a1.65 1.65 0 010 3.3H9.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="creditCount">…</b> crédits</div>
        <button class="burger" id="burgerBtn" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mob-menu" id="mobMenu">
      <a href="app.html">Retouche IA</a>
      <a href="historique.html">Historique</a>
      <a href="parametres.html" class="active">Paramètres</a>
      <a href="tarifs.html">Tarifs</a>
      <a href="shop.html">Shop</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap set-wrap">
    <h1 class="set-title">Paramètres</h1>

    <div class="card">
      <div class="card-h">Compte</div>
      <div class="acct-row">
        <div class="acct-av" id="setAvatar">•</div>
        <div class="acct-meta">
          <b id="setName">Mon compte</b>
          <span id="setMail"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">Abonnement &amp; crédits</div>
      <a class="row" href="tarifs.html">
        <span class="row-l"><svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v9M9.6 10.2h3.1a1.65 1.65 0 010 3.3H9.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Mes crédits</span>
        <span class="val"><b id="setCredits">…</b> crédits</span>
      </a>
      <div class="row-sep"></div>
      <a class="row" href="tarifs.html">
        <span class="row-l"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 7v10a2 2 0 002 2h12a2 2 0 002-2V7M4 7l2-3h12l2 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Changer de forfait</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="row-sep"></div>
      <a class="row" id="rowFacturation" href="facturation.html">
        <span class="row-l"><svg class="ic" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 9.5h18" stroke="currentColor" stroke-width="1.8"/></svg>Facturation</span>
        <span class="val" id="factNote"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <div class="card">
      <button class="btn-logout js-logout" type="button">Se déconnecter</button>
    </div>
  </div>
</main>

<script>
  /* ---------- Supabase : session obligatoire ---------- */
  const SUPABASE_URL = "https://zipzllczqfcfvyydvmpy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ujJAZvyLdjDzFSWbwBguWw_f0yIMJvs";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let USER = null, TOKEN = null, credits = null, plan = null;

  function creditsLabel(){ if(plan==="ultimate") return "∞"; if(credits===null) return "…"; try{return credits.toLocaleString("fr-FR");}catch(e){return String(credits);} }
  function paintCredits(){ const a=document.getElementById("creditCount"); if(a) a.textContent=creditsLabel(); const b=document.getElementById("setCredits"); if(b) b.textContent=creditsLabel(); }
  function fillUser(u){
    USER = u;
    const name = (u.user_metadata && (u.user_metadata.name || u.user_metadata.full_name)) || (u.email ? u.email.split("@")[0] : "Mon compte");
    const setT=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
    setT("setName", name);
    setT("setMail", u.email||"");
    setT("setAvatar", (name.trim().charAt(0)||"•").toUpperCase());
    localStorage.setItem("vendora_user", JSON.stringify({id:u.id,name:name,email:u.email||""}));
    loadCredits();
  }
  const PLAN_NAMES = { discovery:"Découverte", essential:"Essentiel", ultimate:"Ultimate" };
  function updateFacturation(){
    const row=document.getElementById("rowFacturation");
    const note=document.getElementById("factNote");
    if(!row) return;
    const pro = !!(plan && PLAN_NAMES[plan]);
    if(pro){ row.classList.remove("disabled"); row.setAttribute("href","facturation.html"); if(note) note.textContent=""; }
    else { row.classList.add("disabled"); row.removeAttribute("href"); if(note) note.textContent="Réservé aux abonnés"; }
  }
  async function loadCredits(){
    if(!USER) return;
    const { data } = await sb.from("profiles").select("credits, plan").eq("id", USER.id).maybeSingle();
    if(data){ credits = data.credits; plan = data.plan; }
    paintCredits();
    updateFacturation();
  }
  sb.auth.getSession().then(({data})=>{
    if(!data.session){ window.location.href="auth.html"; return; }
    TOKEN = data.session.access_token;
    fillUser(data.session.user);
  });

  // menu hamburger (barre attachée)
  (function(){
    const nav=document.getElementById("nav"), btn=document.getElementById("burgerBtn"), menu=document.getElementById("mobMenu"), scrim=document.getElementById("navScrim");
    if(!nav||!btn||!menu) return;
    const close=()=>{nav.classList.remove("open");btn.setAttribute("aria-expanded","false");if(scrim)scrim.classList.remove("show");};
    btn.addEventListener("click",e=>{e.stopPropagation();const open=nav.classList.toggle("open");btn.setAttribute("aria-expanded",open?"true":"false");if(scrim)scrim.classList.toggle("show",open);});
    menu.querySelectorAll("a").forEach(a=>a.addEventListener("click",close));
    document.addEventListener("click",e=>{ if(!nav.contains(e.target)) close(); });
  })();

  document.querySelectorAll(".js-logout").forEach(el=>el.addEventListener("click",async e=>{e.preventDefault();await sb.auth.signOut();localStorage.removeItem("vendora_user");window.location.href="index.html";}));
</script>
<!-- Vercel Web Analytics -->
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
