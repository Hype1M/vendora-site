<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vendora.ai — Améliore ta photo</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4f5f7;--surface:#fff;--panel:#fafafa;--border:#eaeaec;--border-2:#e0e3ef;--hair:#f0f0f2;
    --text:#0e0f13;--muted:#6b6d78;--faint:#9a9ca6;--brand:#2f6bff;
    --font:"Plus Jakarta Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);font-weight:400;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{width:min(1000px,90%);margin-inline:auto}

  header{position:sticky;top:14px;z-index:50;margin-top:14px}
  .nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 10px 0 18px;
    background:rgba(255,255,255,.75);backdrop-filter:blur(16px) saturate(180%);
    border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 2px rgba(14,15,19,.04),0 12px 28px -18px rgba(14,15,19,.25)}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px}
  .logo .mark{width:28px;height:28px;border-radius:8px;background:var(--text);display:grid;place-items:center}
  .logo .mark svg{width:16px;height:16px}
  .logo .ai{color:var(--faint);font-weight:600}
  .back{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:500;font-size:14px}
  .back:hover{color:var(--text)}
  .back svg{width:16px;height:16px}
  .credits{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 13px}
  .credits svg{width:15px;height:15px;color:var(--brand)}
  .credits b{color:var(--text);font-weight:700}

  .account{position:relative}
  .acct-btn{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 11px 5px 6px;cursor:pointer;font-family:var(--font);transition:border-color .15s}
  .acct-btn:hover{border-color:var(--faint)}
  .avatar{width:30px;height:30px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
  .avatar.sm{width:34px;height:34px;font-size:14px;border-radius:9px}
  .acct-info{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
  .acct-name{font-weight:600;font-size:13.5px;color:var(--text)}
  .acct-cr{font-size:11.5px;color:var(--muted)}
  .acct-cr{font-size:13.5px;font-weight:600;color:var(--text)}
  .acct-cr b{color:var(--text);font-weight:700}
  .acct-chev{width:15px;height:15px;color:var(--faint);transition:transform .15s}
  .account.open .acct-chev{transform:rotate(180deg)}
  .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px -16px rgba(14,15,19,.3);padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.16s}
  .account.open .acct-menu{opacity:1;visibility:visible;transform:translateY(0)}
  .acct-head{display:flex;align-items:center;gap:10px;padding:10px 12px 12px;border-bottom:1px solid var(--hair);margin-bottom:6px}
  .acct-head b{display:block;font-size:14px;font-weight:600}
  .acct-head span{color:var(--muted);font-size:12.5px}
  .acct-menu a{display:block;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--text);font-weight:500}
  .acct-menu a:hover{background:var(--panel)}
  @media(max-width:600px){.acct-name{display:none}}

  .btn{font-family:var(--font);font-weight:600;font-size:14.5px;cursor:pointer;border:none;border-radius:8px;padding:11px 18px;transition:background .15s,border-color .15s}
  .btn-primary{background:var(--text);color:#fff}
  .btn-primary:hover{background:#25262c}
  .btn-line{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn-line:hover{border-color:var(--faint)}

  main{padding:120px 0 110px}
  .head{text-align:center;max-width:560px;margin:0 auto 30px}
  .head h1{font-weight:700;font-size:clamp(26px,3.6vw,36px);letter-spacing:-.03em;margin-bottom:8px}
  .head h1 .k{color:var(--brand)}
  .head p{color:var(--muted);font-size:15.5px}

  /* éditeur posé directement sur le fond de l'app (pas de carte) */
  .tool{max-width:520px;margin:0 auto;text-align:center}
  .preview{display:none;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:18px;background:#fff}
  .preview.show{display:block}
  .preview img{width:100%;display:block;max-height:70vh;object-fit:cover}
  .import-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin:0 auto;padding:16px 30px;border:none;border-radius:12px;background:var(--text);color:#fff;cursor:pointer;font-family:var(--font);font-weight:600;font-size:15px;transition:background .15s}
  .import-btn:hover{background:#25262c}
  .import-btn svg{width:18px;height:18px}

  /* bloc de choix des fonds */
  .bgpick{margin-top:64px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;text-align:left;box-shadow:0 1px 2px rgba(14,15,19,.04),0 18px 40px -30px rgba(14,15,19,.3)}
  .bgpick-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:16px}
  .bgs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .bg{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px 10px 10px;font-family:var(--font);font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:.15s}
  .bg:hover{color:var(--text);border-color:var(--faint)}
  .bg.active{border-color:var(--text);color:var(--text)}
  .bg .sw{width:28px;height:28px;border-radius:8px;border:1px solid var(--border-2);background-size:cover;background-position:center;flex-shrink:0}

  .go{width:100%;margin-top:28px;padding:15px;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;border:none;border-radius:12px;background:var(--text);color:#fff;transition:background .15s}
  .go:hover{background:#25262c}
  .go:disabled{background:var(--panel);color:var(--faint);border:1px solid var(--border);cursor:not-allowed}
  .go:disabled:hover{background:var(--panel)}
  .hint{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--faint);font-size:12.5px;margin-top:12px}
  .hint svg{width:14px;height:14px;color:var(--brand)}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M6 7l6 10.5L18 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18.6" cy="5.4" r="1.7" fill="#5b8cff"/></svg></span>
      <span>Vendora<span class="ai">.ai</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="account" id="account">
        <button class="acct-btn" id="acctBtn">
          <span class="avatar" id="avatar">T</span>
          <span class="acct-cr"><b id="creditCount">120</b> crédits</span>
          <svg class="acct-chev" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="acct-menu" id="acctMenu">
          <div class="acct-head"><span class="avatar sm" id="avatar2">T</span><div><b id="menuName">Thomas</b><span id="menuMail">thomas@exemple.com</span></div></div>
          <a href="#">Mon compte</a>
          <a href="#pricing">Mes crédits & facturation</a>
          <a href="index.html" id="logout">Déconnexion</a>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="tool" id="editor">
      <div class="preview" id="preview"></div>
      <label class="import-btn" id="importBtn">
        <input type="file" id="file" accept="image/*" hidden />
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0 4 4m-4-4-4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span id="importLabel">Importer une photo</span>
      </label>

      <div class="bgpick">
        <span class="bgpick-label">Le fond</span>
        <div class="bgs">
          <button class="bg" data-bg="parquet"><span class="sw" style="background-image:url('backgrounds/parquet.jpg')"></span>Parquet</button>
          <button class="bg" data-bg="moquette"><span class="sw" style="background-image:url('backgrounds/moquette.jpg')"></span>Moquette</button>
          <button class="bg" data-bg="solbrut"><span class="sw" style="background-image:url('backgrounds/solbrut.jpg')"></span>Sol brut</button>
          <button class="bg" data-bg="tapis"><span class="sw" style="background-image:url('backgrounds/tapis.png')"></span>Tapis</button>
        </div>
      </div>

      <button class="go" id="go" disabled>Améliorer ma photo</button>
      <p class="hint"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 13h6l-1 9 9-11h-6l1-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg> 100 crédits par photo · export HD sans filigrane</p>
    </div>
  </div>
</main>

<script>
  /* PREVIEW */ document.getElementById("creditCount").textContent="120";
  const SUPABASE_URL = "https://zipzllczqfcfvyydvmpy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ujJAZvyLdjDzFSWbwBguWw_f0yIMJvs";
  const sb = { auth:{ getSession:async()=>({data:{session:null}}), signOut:async()=>{} }, from:()=>({select:()=>({eq:()=>({maybeSingle:async()=>({data:null})})})}) };

  const COST = 100; // crédits par génération
  const BACKEND = "https://vendorastudio-api.vercel.app"; // backend Next (Vercel) — CORS + auth + crédits serveur
  let USER = null, TOKEN = null, credits = null, plan = null;

  function creditsLabel(){ if(plan==="ultimate") return "∞"; if(credits===null) return "…"; try{return credits.toLocaleString("fr-FR");}catch(e){return String(credits);} }
  function paintCredits(){ document.getElementById("creditCount").textContent = creditsLabel(); }

  function fillUser(u){
    USER = u;
    const name = (u.user_metadata && (u.user_metadata.name || u.user_metadata.full_name)) || (u.email ? u.email.split("@")[0] : "Mon compte");
    const initial = name.trim().charAt(0).toUpperCase();
    document.getElementById("avatar").textContent=initial;
    document.getElementById("avatar2").textContent=initial;
    document.getElementById("menuName").textContent=name;
    document.getElementById("menuMail").textContent=u.email||"";
    localStorage.setItem("vendora_user", JSON.stringify({id:u.id,name:name,email:u.email||""}));
    loadCredits();
  }
  async function loadCredits(){
    if(!USER) return;
    const { data } = await sb.from("profiles").select("credits, plan").eq("id", USER.id).maybeSingle();
    if(data){ credits = data.credits; plan = data.plan; }
    paintCredits();
  }
  sb.auth.getSession().then(({data})=>{
    if(!data.session){ }
    TOKEN = data.session.access_token;
    fillUser(data.session.user);
  });

  const account=document.getElementById("account");
  document.getElementById("acctBtn").addEventListener("click",e=>{e.stopPropagation();account.classList.toggle("open");});
  document.addEventListener("click",()=>account.classList.remove("open"));
  document.getElementById("logout").addEventListener("click",async e=>{e.preventDefault();await sb.auth.signOut();localStorage.removeItem("vendora_user");window.location.href="index.html";});

  const file=document.getElementById("file");
  const preview=document.getElementById("preview"),importLabel=document.getElementById("importLabel"),go=document.getElementById("go");
  let bg=null;
  function updateGo(){ go.disabled = !(file.files && file.files[0] && bg); }
  document.querySelectorAll(".bg").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".bg").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");bg=b.dataset.bg;updateGo();
  }));
  function render(){
    const f=file.files&&file.files[0];
    if(!f) return;
    const url=URL.createObjectURL(f);
    preview.innerHTML='<img src="'+url+'" alt="aperçu">';
    preview.classList.add("show");
    importLabel.textContent="Changer de photo";
    updateGo();
  }
  file.addEventListener("change",render);
  document.getElementById("resetBtn")?.addEventListener("click",()=>{ location.reload(); });
  function showResult(url){
    preview.innerHTML='<img src="'+url+'" alt="résultat">';
    preview.classList.add("show");
    importLabel.textContent="Nouvelle photo";
    // bouton de téléchargement
    let dl=document.getElementById("dlBtn");
    if(!dl){ dl=document.createElement("a"); dl.id="dlBtn"; dl.className="go"; document.getElementById("editor").appendChild(dl); }
    dl.textContent="Télécharger"; dl.href=url; dl.download="vendora.png"; dl.style.display="block";
  }

  go.addEventListener("click",async ()=>{
    if(!file.files||!file.files[0]||!bg){ return; }
    if(!TOKEN){ alert("Session expirée, reconnecte-toi."); location.href="auth.html"; return; }
    if(plan!=="ultimate" && credits!==null && credits < COST){
      alert("Crédits insuffisants — il faut "+COST+" crédits par génération (solde : "+credits+").");
      location.href="index.html#pricing"; return;
    }
    go.disabled=true; const prev=go.textContent; go.textContent="Amélioration… (jusqu'à 3 min)";
    try{
      // génération via le backend Vercel — il vérifie le token, décompte les crédits
      // côté serveur et renvoie l'image (ou 402 si crédits épuisés).
      const fd=new FormData();
      fd.append("image1", file.files[0], file.files[0].name||"photo.png");
      fd.append("background", bg);
      const r=await fetch(BACKEND+"/api/generate",{
        method:"POST",
        headers:{ "Authorization":"Bearer "+TOKEN },
        body:fd
      });
      if(r.status===402){ // crédits épuisés → paywall
        alert("Crédits insuffisants — recharge ton forfait pour continuer.");
        location.href="index.html#pricing"; return;
      }
      const ct=r.headers.get("content-type")||"";
      if(!(r.ok && ct.indexOf("image/")===0)){
        let msg="Échec de la génération ("+r.status+").";
        try{ const j=await r.json(); if(j&&j.error) msg=j.error; }catch(e){}
        alert(msg); return;
      }
      const blob=await r.blob();
      // affiche le résultat puis rafraîchit le solde (mis à jour côté serveur)
      showResult(URL.createObjectURL(blob));
      loadCredits();
    }catch(err){
      alert("Impossible de contacter le serveur (il démarrait peut-être — réessaie dans quelques secondes).");
    }finally{
      go.disabled=false; go.textContent=prev;
    }
  });
</script>
<!-- Vercel Web Analytics -->
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
